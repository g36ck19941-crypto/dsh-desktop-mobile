plugins {
  id 'com.android.application'
}

android {
  namespace 'com.dsh.mobile'
  compileSdk 34

  defaultConfig {
    applicationId "com.dsh.mobile"
    minSdk 26
    targetSdk 34
    versionCode 2
    versionName "0.2.0"
  }

  signingConfigs {
    release {
      storeFile file("../keystore/dsh-release.keystore")
      storePassword "dsh123456"
      keyAlias "dsh"
      keyPassword "dsh123456"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
